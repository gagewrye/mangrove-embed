[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mangrove-embed"
version = "0.1.0"
description = "Cross-region mangrove classification diagnostics on AlphaEarth embeddings"
requires-python = ">=3.10"
dependencies = [
    "earthengine-api>=1.0",
    "numpy",
    "pandas>=2.0",
    "pyarrow",
    "pyyaml",
    "scikit-learn>=1.3",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mangrove = "mangrove_embed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
