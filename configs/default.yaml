# Earth Engine Cloud project. Overridden by EE_PROJECT or --project.
project: intricate-web-334523

year: 2020                 # must be a GMW v3 year (1996, 2007-2010, 2015-2020)
mangrove_label: extent     # extent (all mangroves) or core (stable dense only)
scales: [0, 1, 3, 7]       # neighborhood radius in 10 m pixels (0 = center pixel)
coast_buffer_m: 5000       # non-mangrove classes sampled only within this distance of mangrove
n_per_class: 300           # labeled samples per class per region
n_unlabeled: 3000          # random coastal-zone pixels per region (label-free, for centering)
tile_deg: 0.25             # tile size for server requests
workers: 6                 # concurrent Earth Engine requests
block_deg: 0.05            # spatial CV block size within a region (~5 km)
anchor: jamaica            # single-region-training probe; null to skip
seed: 42

data_dir: data
results_dir: results

# [west, south, east, north] — v3 set from mangrove_training_knn.js, plus Jamaica (drone site).
regions:
  mexico_pacific: [-112.3, 24.2, -110.2, 25.4]   # arid reference: Magdalena Bay / La Paz
  sundarbans:     [88.4, 21.5, 89.6, 22.4]       # rice, shrimp ponds, villages
  mekong:         [104.6, 8.5, 106.9, 10.5]      # shrimp-mangrove mosaic, Melaleuca
  mahakam:        [117.1, -1.1, 117.7, -0.3]     # nipa palm, aquaculture
  matang:         [100.4, 4.6, 100.8, 5.1]       # managed mangroves, oil palm
  niger_delta:    [5.6, 4.2, 7.0, 4.8]           # freshwater swamp forest, nipa invasion
  para:           [-47.6, -1.2, -45.8, -0.6]     # Amazon coast, várzea forest
  papua:          [137.5, -5.0, 138.6, -4.3]     # rainforest and swamp forest to the shore
  everglades:     [-81.5, 25.1, -80.7, 25.8]     # salt marsh, freshwater swamp
  rufiji:         [39.1, -8.2, 39.5, -7.7]       # Tanzania delta, rice, woodland
  jamaica:        [-78.4, 17.7, -76.2, 18.6]     # E4E drone ground truth
